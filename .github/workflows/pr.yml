name: pullrequest
# Do the same build as the official build but don't publish artifacts.

on:
  # Trigger on pull requests or can be run manually on branches too
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
      with:
        nuget-version: '7.9.0'

    - name: Verify dependency lock files
      shell: pwsh
      run: |
        $lockFiles = @(
          'SyncKusto\packages.lock.json'
          'SyncKusto.Core\packages.lock.json'
          'SyncKusto.Kusto\packages.lock.json'
          'SyncKusto.FileSystem\packages.lock.json'
          'SyncKusto.Tests\packages.lock.json'
        )
        foreach ($lockFile in $lockFiles) {
          if (-not (Test-Path -LiteralPath $lockFile -PathType Leaf)) {
            throw "Required dependency lock file is missing: $lockFile"
          }
        }

    - name: Restore Packages
      run: nuget restore SyncKusto.sln -LockedMode -ConfigFile NuGet.Config -NonInteractive

    - name: Build Solution
      run: msbuild.exe SyncKusto.sln /t:Build /p:Configuration=Release

    - name: Test schema imports offline
      run: dotnet test SyncKusto.Tests\SyncKusto.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=SchemaImport"
      
