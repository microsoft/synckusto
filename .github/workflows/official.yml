name: official
# Full build along with artifact publishing

on:
  push:
    # Build on any new push to the master branch
    branches: [ master ]
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Create one build every month even if there are no new checkins to work around expiring artifacts from older builds
    - cron:  '0 0 1 * *'  
  workflow_dispatch: 
    # Allows you to run this workflow manually from the Actions tab

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
      with:
        nuget-version: '7.9.0'

    - name: Verify dependency lock files
      shell: pwsh
      run: |
        $lockFiles = @(
          'SyncKusto\packages.lock.json'
          'SyncKusto.Core\packages.lock.json'
          'SyncKusto.Kusto\packages.lock.json'
          'SyncKusto.FileSystem\packages.lock.json'
          'SyncKusto.Tests\packages.lock.json'
        )
        foreach ($lockFile in $lockFiles) {
          if (-not (Test-Path -LiteralPath $lockFile -PathType Leaf)) {
            throw "Required dependency lock file is missing: $lockFile"
          }
        }

    - name: Restore Packages
      run: nuget restore SyncKusto.sln -LockedMode -ConfigFile NuGet.Config -NonInteractive

    - name: Build Solution
      run: msbuild.exe SyncKusto.sln /t:Build /p:Configuration=Release
        
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: published
        path: SyncKusto/bin/Release
      
