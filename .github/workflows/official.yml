name: official
# Full build along with artifact publishing

on:
  push:
    # Build on any new push to the master branch
    branches: [ master ]
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Create one build every month even if there are no new checkins to work around expiring artifacts from older builds
    - cron:  '0 0 1 * *'  
  workflow_dispatch: 
    # Allows you to run this workflow manually from the Actions tab

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Verify dependency lock files
      shell: pwsh
      run: |
        $lockFiles = @(
          'SyncKusto\packages.lock.json'
          'SyncKusto.Core\packages.lock.json'
          'SyncKusto.Kusto\packages.lock.json'
          'SyncKusto.FileSystem\packages.lock.json'
          'SyncKusto.Tests\packages.lock.json'
        )
        foreach ($lockFile in $lockFiles) {
          if (-not (Test-Path -LiteralPath $lockFile -PathType Leaf)) {
            throw "Required dependency lock file is missing: $lockFile"
          }
        }

    - name: Restore Packages
      run: dotnet restore SyncKusto.sln --locked-mode --configfile NuGet.Config -p:NuGetInteractive=false

    - name: Build Solution
      run: dotnet build SyncKusto.sln --configuration Release --no-restore

    - name: Test offline regressions
      run: dotnet test SyncKusto.Tests\SyncKusto.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=SchemaImport|TestCategory=Kusto|FullyQualifiedName~SyncKusto.Tests.Forms" -- RunConfiguration.TreatNoTestsAsError=true
        
    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: published
        path: SyncKusto/bin/Release
      
